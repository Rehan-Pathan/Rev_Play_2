version: "3.8"

services:

  backend:
    image: revplay-backend
    container_name: revplay-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: ${DB_URL}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./RevPlay_2/uploads:/app/uploads

  frontend:
    image: revplay-frontend
    container_name: revplay-frontend
    ports:
      - "80:80"
    depends_on:
      - backend